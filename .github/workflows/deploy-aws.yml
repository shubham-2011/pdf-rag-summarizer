name: Deploy Backend to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Fast Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (LibreOffice & Poppler)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libreoffice-nogui \
            poppler-utils \
            build-essential \
            curl

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt
          pip install pytest

      - name: Pre-download Offline Embedding Models
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2'); SentenceTransformer('nomic-ai/nomic-embed-text-v1.5', trust_remote_code=True)"

      - name: Run Fast Deterministic Pipeline & Verification Gates
        run: |
          cd tests && python run_pipeline.py --fast

  deploy-ec2:
    name: Deploy to EC2 via SSH
    needs: test
    if: "${{ github.ref == 'refs/heads/main' && secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}"
    runs-on: ubuntu-latest
    steps:
      - name: SSH and update Docker services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/pdf-rag-summarizer
            git pull origin main
            docker compose --env-file .env -f deploy/aws/docker-compose.prod.yml up -d --build
            curl -f http://localhost:80/api/health || exit 1
