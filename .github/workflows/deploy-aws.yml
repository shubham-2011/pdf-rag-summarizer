name: Deploy Backend to AWS

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deploy/aws/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

jobs:
  test:
    name: Fast Verification Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run fast deterministic tests
        run: |
          cd tests && python run_pipeline.py --fast

  deploy-ec2:
    name: Deploy to EC2 via SSH
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and update Docker services
        uses: appleboy/ssh-action@v1.0.3
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/pdf-rag-summarizer
            git pull origin main
            docker compose -f deploy/aws/docker-compose.prod.yml up -d --build
            docker system prune -f
            curl -f http://localhost:80/api/health || exit 1
