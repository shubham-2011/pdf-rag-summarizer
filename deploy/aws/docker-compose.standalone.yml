version: '3.8'

# ==============================================================================
# Pure Backend Standalone Compose (No frontend, No reverse proxy)
# Exposes FastAPI directly on port 8000 (or port 80 via PORT mapping)
# ==============================================================================

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: pdf_rag_backend
    restart: unless-stopped
    ports:
      # Maps EC2 port 8000 to backend port 8000
      - "8000:8000"
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LLM_SYNTHESIS_MODEL=${LLM_SYNTHESIS_MODEL:-gemini-3.6-flash}
      - PROMPT_PIPELINE_ENABLED=${PROMPT_PIPELINE_ENABLED:-true}
      - PIPELINE_RERANK_SCORE_FLOOR=${PIPELINE_RERANK_SCORE_FLOOR:-4.0}
      - MULTIFORMAT_ENABLED=${MULTIFORMAT_ENABLED:-true}
      - CANONICAL_RENDERER=libreoffice
    volumes:
      # Persistent host storage: vector stores, SQLite registry, and uploads
      - ../../backend/storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
