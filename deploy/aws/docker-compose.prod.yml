version: '3.8'

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: pdf_rag_backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LLM_SYNTHESIS_MODEL=${LLM_SYNTHESIS_MODEL:-gemini-3.6-flash}
      - PROMPT_PIPELINE_ENABLED=${PROMPT_PIPELINE_ENABLED:-true}
      - PIPELINE_RERANK_SCORE_FLOOR=${PIPELINE_RERANK_SCORE_FLOOR:-4.0}
      - MULTIFORMAT_ENABLED=${MULTIFORMAT_ENABLED:-true}
      - CANONICAL_RENDERER=libreoffice
    volumes:
      # Persistent host storage: vector stores, SQLite registry, and uploads survive restarts
      - ../../backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    container_name: pdf_rag_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
